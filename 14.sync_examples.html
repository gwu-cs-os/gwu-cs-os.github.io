## **deadlock!**

<br>

everyone **holds** one resource and **waits** for another &rarr; a **cycle**

---

let's look at a `code` example using <scb>pthreads</scb> (Linux)

---

```C
#include <pthread.h>
#include <stdio.h>
#include <unistd.h>

#define N 5
pthread_mutex_t chopstick[N];
int meals[N];

int right(int i) { return (i + 1) % N; }

void *philosopher(void *arg) {
    int i = *(int *)arg;
    while (1) {
        pthread_mutex_lock(&chopstick[i]);         // take left chopstick
        usleep(1000);                              // think a moment... (widens the race)
        pthread_mutex_lock(&chopstick[right(i)]);  // take right chopstick
        meals[i]++;                                // eat_and_be_jolly()
        pthread_mutex_unlock(&chopstick[i]);
        pthread_mutex_unlock(&chopstick[right(i)]);
    }
}

int main(void) {
    pthread_t t[N];
    int id[N];
    for (int i = 0; i < N; i++) pthread_mutex_init(&chopstick[i], NULL);
    for (int i = 0; i < N; i++) { id[i] = i; pthread_create(&t[i], NULL, philosopher, &id[i]); }
    for (int s = 1; s <= 3; s++) {
        sleep(1);
        printf("after %ds: meals = %d %d %d %d %d\n", s, meals[0], meals[1], meals[2], meals[3], meals[4]);
        fflush(stdout);
    }
    return 0;
}
```

## dining philosophers | **solution III**

---

### solution III | **monitor**

```C
monitor DP {
    enum {THINKING, HUNGRY, EATING} state[5];
    cond_t eat_time[5];   // condition -> time to eat

    void pickup(int i) {
        state[i] = HUNGRY;
        time_to_eat(i);
        if (state[i] != EATING)
            wait(eat_time[i]);
    }

    void put_down(int i) {
        state[i] = THINKING;
        time_to_eat(right(i));
        time_to_eat(left(i));
    }

    void time_to_eat(int i) {
        if ((state[right(i)] != EATING) &&
            (state[i] == HUNGRY) &&
            (state[left(i)] != EATING)) {
            state[i] = EATING;
            signal(eat_time[i]);
        }
    }
}
```
