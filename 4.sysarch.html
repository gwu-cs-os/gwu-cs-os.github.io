## xv6 system calls

---

### xv6 system calls

a system call's journey through xv6 

`write(1, "os", 3)`

---

### xv6 system calls

a system call's journey through xv6 &rarr; <scb>write(1, "os", 3)</scb>

<img src="./img/sysarch/xv6_01.png" height="800">

---

### xv6 system calls

user application calls <scb>write()</scb> &rarr; the C library stub

<img src="./img/sysarch/xv6_02.png" height="800">

---

### xv6 system calls

<scb>usys.S</scb>: syscall number &rarr; <scb>a7</scb>, then <scb>ecall</scb> traps into the kernel

<img src="./img/sysarch/xv6_03.png" height="800">

---

### xv6 system calls

<scb>trampoline.S</scb>: save user reg into trap frame &rarr; <scb>jr user_trap</scb>

<img src="./img/sysarch/xv6_04.png" height="800">

Note:
- `jr` is meant to jump to code pointed to by regsiter

---

### xv6 system calls

<scb>trap.c</scb> (user_trap): <scb>scause == 8</scb> means a syscall &rarr; call <scb>syscall()</scb>

<img src="./img/sysarch/xv6_05.png" height="800">

---

### xv6 system calls

<scb>syscall.c</scb>: read num from <scb>a7</scb><br> dispatch via syscall table &rarr; <scb>sys_write</scb>

<img src="./img/sysarch/xv6_06.png" height="700">

---

### xv6 system calls

<scb>sysfile.c</scb> (sys_write): read args fromthe trap frame &rarr; <scb>filewrite()</scb>, return the result in <scb>a0</scb>

<img src="./img/sysarch/xv6_07.png" height="700">

---

### xv6 system calls

back in <scb>trap.c</scb>: <scb>syscall()</scb> returned <br> <scb>usertrapret()</scb> calls <scb>userret()</scb>

<img src="./img/sysarch/xv6_08.png" height="700">

---

### xv6 system calls

<scb>trampoline.S</scb> (userret): restore registers, <scb>sret</scb> back to user

<img src="./img/sysarch/xv6_09.png" height="800">

---

### xv6 system calls

back in the application, return value in <scb>a0</scb>

<img src="./img/sysarch/xv6_10.png" height="800">
