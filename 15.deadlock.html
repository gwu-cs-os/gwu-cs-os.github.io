## **deadlock!**

---

let's look at a `code` example using <scb>pthreads</scb> [<sc>Linux</sc>]

---

```C
#include <pthread.h>
#include <stdio.h>
#include <unistd.h>

pthread_mutex_t s1 = PTHREAD_MUTEX_INITIALIZER;   // "red" lock
pthread_mutex_t s2 = PTHREAD_MUTEX_INITIALIZER;   // "blue" lock

void *thread1(void *arg) {
    pthread_mutex_lock(&s1);
    usleep(1000);                  // widen the window: let thread 2 run
    pthread_mutex_lock(&s2);       // waits for thread 2...
    printf("thread 1: processing\n");
    pthread_mutex_unlock(&s2);
    pthread_mutex_unlock(&s1);
    return NULL;
}

void *thread2(void *arg) {
    pthread_mutex_lock(&s2);       // opposite order!
    usleep(1000);
    pthread_mutex_lock(&s1);       // waits for thread 1...
    printf("thread 2: processing\n");
    pthread_mutex_unlock(&s1);
    pthread_mutex_unlock(&s2);
    return NULL;
}

int main(void) {
    pthread_t t1, t2;
    pthread_create(&t1, NULL, thread1, NULL);
    pthread_create(&t2, NULL, thread2, NULL);
    pthread_join(t1, NULL);
    pthread_join(t2, NULL);
    printf("done\n");
    return 0;
}
```

```C
#include <pthread.h>
#include <stdio.h>
#include <unistd.h>

pthread_mutex_t s1 = PTHREAD_MUTEX_INITIALIZER;
pthread_mutex_t s2 = PTHREAD_MUTEX_INITIALIZER;
int retries[2];

/* take `first` then `second`; if `second` is busy, release `first` and retry */
void lock_both(pthread_mutex_t *first, pthread_mutex_t *second, int id) {
    while (1) {
        pthread_mutex_lock(first);
        usleep(1000);                      // same window as deadlock_demo.c
        if (pthread_mutex_trylock(second) == 0)
            return;                        // got both!
        pthread_mutex_unlock(first);       // "preempt" ourselves
        retries[id]++;
        usleep(100);                       // back off, try again
    }
}

void *thread1(void *arg) {
    lock_both(&s1, &s2, 0);
    usleep(1000);
    printf("thread 1: processing\n");
    pthread_mutex_unlock(&s2);
    pthread_mutex_unlock(&s1);
    return NULL;
}

void *thread2(void *arg) {
    lock_both(&s2, &s1, 1);                // opposite order... but no deadlock
    usleep(1000);
    printf("thread 2: processing\n");
    pthread_mutex_unlock(&s1);
    pthread_mutex_unlock(&s2);
    return NULL;
}

int main(void) {
    pthread_t t1, t2;
    pthread_create(&t1, NULL, thread1, NULL);
    pthread_create(&t2, NULL, thread2, NULL);
    pthread_join(t1, NULL);
    pthread_join(t2, NULL);
    printf("done (retries: %d, %d)\n", retries[0], retries[1]);
    return 0;
}
```
