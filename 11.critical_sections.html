### example | **linked list**

```python
struct node {
    struct node *next;
    char *name;
};
struct node *list = NULL;

list_push(list, new):
    tmp = list->first
    new->next = tmp
    list->first = new

list_pop(list):
    tmp = list->first
    if (tmp):
        list->first = tmp->next
        tmp->next = NULL
    return tmp

list_find(list, name):
    for (n = list->first ; n ; n = n->next):
        if (n->name == name) return n
    return NULL
```

### producer/consumer | **ring buffer**

```C
// producer
while (1) {
    struct item i = produce_item();
    while (count == BUFFER_SIZE) ;
    buffer[in] = i;
    in = (in + 1) % BUFFER_SIZE;
    count++;
}

// consumer
while (1) {
    struct item i;
    while (count == 0) ;
    i = buffer[out];
    out = (out + 1) % BUFFER_SIZE;
    count--;
    consume_item(i);
}
```

### <scb>xv6</scb> | <scb>struct spinlock</scb>

<scb>tickslock</scb> &rarr; a <scb>struct spinlock</scb> (<scb>spinlock.h</scb>)

```C
// Mutual exclusion lock.
struct spinlock {
  uint locked;       // Is the lock held?

  // For debugging:
  char *name;        // Name of lock.
  struct cpu *cpu;   // The cpu holding the lock.
  uint pcs[10];      // The call stack (an array of program counters)
                     // that locked the lock.
};
```

## [**Peterson's** algorithm](https://en.wikipedia.org/wiki/Peterson%27s_algorithm) [1981]

---

### [**Peterson's** algorithm](https://en.wikipedia.org/wiki/Peterson%27s_algorithm) [1981]

```C
// is a thread trying to enter a CS?
bool flag[2] = {false, false};
int turn = me;  // either me or you

while (1) {
    normal_processing();
    flag[me] = true;
    turn = you;
    while (flag[you] == true && turn == you) ;
    critical_section();
    flag[me] = false;
}
```

### bakery algorithm

```C
while (1) {
    choosing[me] = true;
    number[me] = max(number[0], ..., number[n-1]) + 1;
    choosing[me] = false;
    for (them = 0 ; them < n ; them++) {
        while (choosing[them]) ;
        while ((number[them] != 0) &&
               (number[them], them) < (number[me], me)) ;
    }
    critical_section();
    number[me] = 0;
    additional_processing();
}
```

Note:

`choosing[me] = true` marks that this thread is in the middle of choosing its ticket. Without this flag, another thread could read `number[me]` before it has been fully assigned and make an incorrect priority comparison. The thread clears the flag after publishing its ticket; other threads wait for that before comparing tickets.
