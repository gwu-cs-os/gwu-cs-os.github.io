### <scb>xv6</scb> | <scb>yield()</scb>

```C
// Give up the CPU for one scheduling round.
void
yield(void)
{
  acquire(&ptable.lock);  //DOC: yieldlock
  myproc()->state = RUNNABLE;
  sched();
  release(&ptable.lock);
}
```

### <scb>xv6</scb> | **timer interrupt**

```C
  // Force process to give up CPU on clock tick.
  // If interrupts were on while locks held, would need to check nlock.
  if(myproc() && myproc()->state == RUNNING &&
     tf->trapno == T_IRQ0+IRQ_TIMER)
    yield();
```

### <scb>xv6</scb> | <scb>scheduler()</scb>

```C
void
scheduler(void)
{
  struct proc *p;
  struct cpu *c = mycpu();
  c->proc = 0;

  for(;;){
    // Enable interrupts on this processor.
    sti();

    // Loop over process table looking for process to run.
    acquire(&ptable.lock);
    for(p = ptable.proc; p < &ptable.proc[NPROC]; p++){
      if(p->state != RUNNABLE)
        continue;

      // Switch to chosen process.  It is the process's job
      // to release ptable.lock and then reacquire it
      // before jumping back to us.
      c->proc = p;
      switchuvm(p);
      p->state = RUNNING;

      swtch(&(c->scheduler), p->context);
      switchkvm();

      // Process is done running for now.
      // It should have changed its p->state before coming back.
      c->proc = 0;
    }
    release(&ptable.lock);

  }
}
```

```C
/* sched_sim.c: FCFS and round-robin on one CPU (all jobs arrive at time 0) */
#include <stdio.h>

#define N 4

void schedule(char *name, int id[], int burst[], int n, int q)   /* q == 0 -> FCFS */
{
    int left[N], wait[N], first[N], end[N], t = 0, done = 0;

    for (int i = 0; i < n; i++) { left[i] = burst[i]; first[i] = -1; }
    printf("%s:", name);
    while (done < n) {
        for (int i = 0; i < n; i++) {                  /* runqueue order */
            if (left[i] == 0) continue;
            int run = (q == 0 || left[i] < q) ? left[i] : q;
            if (first[i] < 0) first[i] = t;
            printf(" [P%d %d-%d]", id[i], t, t + run);
            t += run;
            left[i] -= run;
            if (left[i] == 0) { end[i] = t; done++; }
        }
    }
    double avg_w = 0, avg_r = 0;
    printf("\n  wait:");
    for (int i = 0; i < n; i++) {
        wait[i] = end[i] - burst[i];
        printf(" P%d=%d", id[i], wait[i]);
        avg_w += wait[i];
        avg_r += first[i];
    }
    printf("  avg=%.2f   avg first-run=%.2f\n", avg_w / n, avg_r / n);
}

int main(void)
{
    int ia[] = {1, 2, 3}, a[] = {24, 3, 3};          /* arrive P1, P2, P3 */
    int ib[] = {2, 3, 1}, b[] = {3, 3, 24};          /* arrive P2, P3, P1 */
    int ic[] = {1, 2, 3, 4}, c[] = {6, 3, 1, 7};

    schedule("FCFS", ia, a, 3, 0);
    schedule("FCFS", ib, b, 3, 0);
    schedule("FCFS", ic, c, 4, 0);
    schedule("RR Q=3", ic, c, 4, 3);
    return 0;
}
```

### <sc>Linux</sc> | <scb>__pick_next_task()</scb>

```C
for_each_class(class) {                 // stop → dl → rt → fair → idle
    p = class->pick_next_task(rq);
    if (p)
        return p;                       // first class with a runnable thread wins
}
```
