### <scb>xv6</scb> | <scb>fork()</scb>

```C
int
fork(void)
{
  ...
  // Allocate process.
  if((np = allocproc()) == 0){
    return -1;
  }

  // Copy process state from proc.
  if((np->pgdir = copyuvm(curproc->pgdir, curproc->sz)) == 0){
    ...
  }
  np->sz = curproc->sz;
  np->parent = curproc;
  *np->tf = *curproc->tf;

  // Clear %eax so that fork returns 0 in the child.
  np->tf->eax = 0;

  for(i = 0; i < NOFILE; i++)
    if(curproc->ofile[i])
      np->ofile[i] = filedup(curproc->ofile[i]);
  ...
  np->state = RUNNABLE;
  ...
  return pid;
}
```

---

### <scb>xv6</scb> | <scb>fork()</scb>

```C [6|11|15|16|19|21-23|25|27]
int
fork(void)
{
  ...
  // Allocate process.
  if((np = allocproc()) == 0){
    return -1;
  }

  // Copy process state from proc.
  if((np->pgdir = copyuvm(curproc->pgdir, curproc->sz)) == 0){
    ...
  }
  np->sz = curproc->sz;
  np->parent = curproc;
  *np->tf = *curproc->tf;

  // Clear %eax so that fork returns 0 in the child.
  np->tf->eax = 0;

  for(i = 0; i < NOFILE; i++)
    if(curproc->ofile[i])
      np->ofile[i] = filedup(curproc->ofile[i]);
  ...
  np->state = RUNNABLE;
  ...
  return pid;
}
```

Note:
- copyuvm = copy ALL of the parent's user memory, page by page.
- %eax is the x86 return-value register -> the child sees 0; the parent gets pid.

let's look at a `code` example... <scb>forktest.c</scb>

---

```C
int pid;
pid = fork();
if (pid == 0) {          // child
    execlp("/bin/ret42", ...);
    // never get here
} else if (pid > 0) {    // parent
    int retval, retpid;
    retpid = wait(&retval);
    assert(retpid == pid);
    printf("%d\n", retval);
} else {                 // error
    ...process error...
}
```

### <scb>xv6</scb> | <scb>exit()</scb>

```C
void
exit(void)
{
  ...
  if(curproc == initproc)
    panic("init exiting");

  // Close all open files.
  for(fd = 0; fd < NOFILE; fd++){
    if(curproc->ofile[fd]){
      fileclose(curproc->ofile[fd]);
      ...
  }
  ...
  // Parent might be sleeping in wait().
  wakeup1(curproc->parent);

  // Pass abandoned children to init.
  for(p = ptable.proc; p < &ptable.proc[NPROC]; p++){
    if(p->parent == curproc){
      p->parent = initproc;
      ...
  }

  // Jump into the scheduler, never to return.
  curproc->state = ZOMBIE;
  sched();
  panic("zombie exit");
}
```

### <scb>xv6</scb> | <scb>wait()</scb>

```C
for(;;){
  // Scan through table looking for exited children.
  havekids = 0;
  for(p = ptable.proc; p < &ptable.proc[NPROC]; p++){
    if(p->parent != curproc)
      continue;
    havekids = 1;
    if(p->state == ZOMBIE){
      // Found one.
      pid = p->pid;
      kfree(p->kstack);
      ...
      freevm(p->pgdir);
      ...
      p->state = UNUSED;
      release(&ptable.lock);
      return pid;
    }
  }
  ...
  // Wait for children to exit.  (See wakeup1 call in proc_exit.)
  sleep(curproc, &ptable.lock);
}
```

### <scb>xv6</scb> | <scb>kill()</scb>

- just sets a **flag**: <scb>p-&gt;killed = 1</scb>
- victim notices on next trip into kernel (<scb>trap.c</scb>) 
- calls <scb>exit()</scb>
