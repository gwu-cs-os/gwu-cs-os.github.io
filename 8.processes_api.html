### <scb>xv6</scb> | <scb>kfork()</scb>

```C
int
kfork(void)
{
  ...
  // Allocate process.
  if ((np = allocproc()) == 0) {
    return -1;
  }

  // Copy user memory from parent to child.
  if (uvmcopy(p->pagetable, np->pagetable, p->sz) < 0) {
    ...
  }
  np->sz = p->sz;

  // copy saved user registers.
  *(np->trapframe) = *(p->trapframe);

  // Cause fork to return 0 in the child.
  np->trapframe->a0 = 0;

  // increment reference counts on open file descriptors.
  for (i = 0; i < NOFILE; i++)
    if (p->ofile[i])
      np->ofile[i] = filedup(p->ofile[i]);
  ...
  np->state = RUNNABLE;
  ...
  return pid;
}
```

---

### <scb>xv6</scb> | <scb>kfork()</scb>

```C [6|11|17|20|23-25|27|29]
int
kfork(void)
{
  ...
  // Allocate process.
  if ((np = allocproc()) == 0) {
    return -1;
  }

  // Copy user memory from parent to child.
  if (uvmcopy(p->pagetable, np->pagetable, p->sz) < 0) {
    ...
  }
  np->sz = p->sz;

  // copy saved user registers.
  *(np->trapframe) = *(p->trapframe);

  // Cause fork to return 0 in the child.
  np->trapframe->a0 = 0;

  // increment reference counts on open file descriptors.
  for (i = 0; i < NOFILE; i++)
    if (p->ofile[i])
      np->ofile[i] = filedup(p->ofile[i]);
  ...
  np->state = RUNNABLE;
  ...
  return pid;
}
```

Note:
- uvmcopy = copy ALL of the parent's user memory, page by page.
- a0 is the RISC-V return-value register -> the child sees 0; the parent gets pid.

### <scb>xv6</scb> | <scb>init</scb>

```C
for (;;) {
  printf("init: starting sh\n");
  pid = fork();
  ...
  if (pid == 0) {
    exec("sh", argv);
    printf("init: exec sh failed\n");
    exit(1);
  }

  for (;;) {
    // this call to wait() returns if the shell exits,
    // or if a parentless process exits.
    wpid = wait((int *)0);
    if (wpid == pid) {
      // the shell exited; restart it.
      break;
    } else if (wpid < 0) {
      ...
    } else {
      // it was a parentless process; do nothing.
    }
  }
}
```

### <scb>xv6</scb> | <scb>kexit()</scb>

```C
void
kexit(int status)
{
  ...
  // Close all open files.
  for (int fd = 0; fd < NOFILE; fd++) {
    ...
      fileclose(f);
  }
  ...
  // Give any children to init.
  reparent(p);

  // Parent might be sleeping in wait().
  wakeup(p->parent);
  ...
  p->xstate = status;
  p->state = ZOMBIE;
  ...
  // Jump into the scheduler, never to return.
  sched();
  panic("zombie exit");
}
```
