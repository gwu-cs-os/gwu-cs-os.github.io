### CFS | **share**

- $w_i$ &rarr; **weight** of thread $\tau_i$

```C
/* nice_share.c: two CPU-bound processes on ONE core, nice 0 vs. nice 3 */
#define _GNU_SOURCE
#include <sched.h>
#include <stdio.h>
#include <stdlib.h>
#include <sys/resource.h>
#include <sys/wait.h>
#include <time.h>
#include <unistd.h>

double now(void)
{
    struct timespec ts;
    clock_gettime(CLOCK_MONOTONIC, &ts);
    return ts.tv_sec + ts.tv_nsec / 1e9;
}

int main(void)
{
    int nices[2] = {0, 3};
    cpu_set_t one;

    CPU_ZERO(&one);
    CPU_SET(0, &one);
    for (int i = 0; i < 2; i++) {
        if (fork() == 0) {
            sched_setaffinity(0, sizeof(one), &one);    /* both on core 0 */
            setpriority(PRIO_PROCESS, 0, nices[i]);
            double end = now() + 3.0;
            while (now() < end)                         /* spin for 3 s */
                ;
            struct rusage ru;
            getrusage(RUSAGE_SELF, &ru);
            printf("nice %d: %.2f s of CPU\n", nices[i],
                   ru.ru_utime.tv_sec + ru.ru_utime.tv_usec / 1e6 +
                   ru.ru_stime.tv_sec + ru.ru_stime.tv_usec / 1e6);
            exit(0);
        }
    }
    while (wait(NULL) > 0)
        ;
    return 0;
}
```

```C
/* rta.c: response-time analysis for fixed-priority tasks (index 0 = highest priority) */
#include <stdio.h>

int ceil_div(int a, int b) { return (a + b - 1) / b; }

int rta(int i, int e[], int p[])
{
    int w = e[i], r;

    for (;;) {
        r = e[i];
        for (int j = 0; j < i; j++)                     /* higher-priority tasks */
            r += ceil_div(w, p[j]) * e[j];
        printf("  RTA%d(%d) = %d\n", i, w, r);
        if (r == w || r > p[i]) return r;               /* converged, or past deadline */
        w = r;
    }
}

int main(void)
{
    int e1[] = {1, 3, 1}, e2[] = {1, 3, 2}, p[] = {3, 6, 9};

    for (int k = 0; k < 2; k++) {
        int *e = k ? e2 : e1;
        printf("e2 = %d:\n", e[2]);
        int r = rta(2, e, p);
        printf("  -> %d %s %d: %s\n", r, r <= p[2] ? "<=" : ">", p[2],
               r <= p[2] ? "schedulable" : "NOT schedulable");
    }
    return 0;
}
```
