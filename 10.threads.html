let's look at a `code` example using <scb>pthreads</scb> (Linux)

---

```C
#include <pthread.h>
#include <stdio.h>

int counter = 0;                    // shared: global data

void *worker(void *arg) {
    int id = *(int *)arg;           // private: on this thread's stack
    for (int i = 0; i < 1000000; i++)
        counter++;                  // no synchronization!
    printf("thread %d done\n", id);
    return NULL;
}

int main(void) {
    pthread_t t[2];
    int ids[2] = {0, 1};
    for (int i = 0; i < 2; i++)
        pthread_create(&t[i], NULL, worker, &ids[i]);
    for (int i = 0; i < 2; i++)
        pthread_join(t[i], NULL);
    printf("counter = %d\n", counter);
    return 0;
}
```

### <scb>xv6</scb> | **scheduler &rarr; kernel thread**

```C
void
scheduler(void)
{
  struct proc *p;
  struct cpu *c = mycpu();
  c->proc = 0;

  for(;;){
    // Enable interrupts on this processor.
    sti();

    // Loop over process table looking for process to run.
    acquire(&ptable.lock);
    for(p = ptable.proc; p < &ptable.proc[NPROC]; p++){
      if(p->state != RUNNABLE)
        continue;
      ...
      c->proc = p;
      switchuvm(p);
      p->state = RUNNING;

      swtch(&(c->scheduler), p->context);
      switchkvm();
      ...
      c->proc = 0;
    }
    release(&ptable.lock);
  }
}
```
