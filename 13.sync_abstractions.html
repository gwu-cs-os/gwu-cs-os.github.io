### <scb>xv6</scb> | <scb>sleeplock.h</scb>

```C
// Long-term locks for processes
struct sleeplock {
  uint locked;       // Is the lock held?
  struct spinlock lk; // spinlock protecting this sleep lock
  
  // For debugging:
  char *name;        // Name of lock.
  int pid;           // Process holding lock
};
```

  uint locked;       // Is the lock held?

---

### <scb>xv6</scb> | <scb>sleeplock.c</scb>

```C
void
acquiresleep(struct sleeplock *lk)
{
  acquire(&lk->lk);
  while (lk->locked) {
    sleep(lk, &lk->lk);
  }
  lk->locked = 1;
  lk->pid = myproc()->pid;
  release(&lk->lk);
}

void
releasesleep(struct sleeplock *lk)
{
  acquire(&lk->lk);
  lk->locked = 0;
  lk->pid = 0;
  wakeup(lk);
  release(&lk->lk);
}
```

| operation | description | where |

### blocking mutexes

```C
// n = 1: # of threads that can enter the CS
wait() {
    n--;
    if (n < 0) {
        waitq_enqueue(curr_thd);
        block&schedule();
    }
}

signal() {
    n++;
    if (n <= 0) {
        t = waitq_dequeue();
        wakeup&schedule(t);
    }
}
```

let's look at a `code` example... threads doing **blocking I/O**

---

```C
struct ring_buffer rb;
int nblked = 0;
mutex_t IO_mux;
cv_t IO_blklist;

get_IO(void) {
    lock(IO_mux);
    if (ring_empty(&rb)) {
        nblked++;
        wait_cv(IO_blklist, IO_mux);
    }
    d = ring_dequeue(&rb);
    unlock(IO_mux);
}

// generate the I/O
post_IO(void *d) {
    lock(IO_mux);
    if (nblked) {
        signal_cv(IO_blklist);
        nblked--;
    }
    ring_enqueue(&rb, d);
    unlock(IO_mux);
}
```

```C
#include <pthread.h>
#include <stdio.h>

#define N 100000                          /* items produced */

int ring = 0;                             /* # of items available (stands in for a ring buffer) */
int consumed[3];
pthread_mutex_t io_mux = PTHREAD_MUTEX_INITIALIZER;
pthread_cond_t  io_cv  = PTHREAD_COND_INITIALIZER;
int done = 0;

void *get_io(void *arg) {                 /* consumer */
    int id = *(int *)arg;
    while (1) {
        pthread_mutex_lock(&io_mux);
        while (ring == 0 && !done)        /* WHILE, not if: re-check after waking */
            pthread_cond_wait(&io_cv, &io_mux);
        if (ring == 0 && done) {
            pthread_mutex_unlock(&io_mux);
            return NULL;
        }
        ring--;                           /* take one item */
        consumed[id]++;
        pthread_mutex_unlock(&io_mux);
    }
}

void post_io(void) {                      /* producer */
    pthread_mutex_lock(&io_mux);
    ring++;                               /* add one item */
    pthread_cond_signal(&io_cv);          /* wake (at least) one waiter */
    pthread_mutex_unlock(&io_mux);
}

int main(void) {
    pthread_t t[3];
    int ids[3] = {0, 1, 2};
    for (int i = 0; i < 3; i++)
        pthread_create(&t[i], NULL, get_io, &ids[i]);
    for (int i = 0; i < N; i++)
        post_io();
    pthread_mutex_lock(&io_mux);
    done = 1;
    pthread_cond_broadcast(&io_cv);       /* wake everyone to exit */
    pthread_mutex_unlock(&io_mux);
    for (int i = 0; i < 3; i++)
        pthread_join(t[i], NULL);
    printf("consumed: %d + %d + %d = %d\n", consumed[0], consumed[1], consumed[2],
           consumed[0] + consumed[1] + consumed[2]);
    return 0;
}
```

### <scb>xv6</scb> | <scb>pipewrite()</scb>

```C
int
pipewrite(struct pipe *p, char *addr, int n)
{
  int i;

  acquire(&p->lock);
  for(i = 0; i < n; i++){
    while(p->nwrite == p->nread + PIPESIZE){  //DOC: pipewrite-full
      ...
      wakeup(&p->nread);
      sleep(&p->nwrite, &p->lock);  //DOC: pipewrite-sleep
    }
    p->data[p->nwrite++ % PIPESIZE] = addr[i];
  }
  wakeup(&p->nread);  //DOC: pipewrite-wakeup1
  release(&p->lock);
  return n;
}

```java
class IO {
    LinkedList<Data> io_queue;
    int nblked;

    public synchronized Data get_io() {
        while (io_queue.size() == 0) {
            nblked++;
            this.wait();
        }
        return io_queue.remove();
    }

    public synchronized void post_io(Data io) {
        if (nblked > 0) {
            nblked--;
            this.notify();
        }
        io_queue.add(io);
    }
}

reader:
    lock(mutex);
    read_num++;
    if (read_num == 1)
        lock(write_mut);
    unlock(mutex);
    read_data_struct();
    lock(mutex);
    read_num--;
    if (read_num == 0)
        unlock(write_mut);
    unlock(mutex);

writer:
    lock(write_mut);
    read_data_struct();
    write_data_struct();
    unlock(write_mut);
```
