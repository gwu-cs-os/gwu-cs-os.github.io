### <scb>xv6</scb> | <scb>pushcli()</scb>/<scb>popcli()</scb>

```C
void
pushcli(void)
{
  int eflags;

  eflags = readeflags();
  cli();
  if(mycpu()->ncli == 0)
    mycpu()->intena = eflags & FL_IF;
  mycpu()->ncli += 1;
}

void
popcli(void)
{
  if(readeflags()&FL_IF)
    panic("popcli - interruptible");
  if(--mycpu()->ncli < 0)
    panic("popcli");
  if(mycpu()->ncli == 0 && mycpu()->intena)
    sti();
}
```

### fetch & add | **atomic counter**

```C
#include <pthread.h>
#include <stdio.h>

int counter = 0;                       // shared

void *worker(void *arg) {
    for (int i = 0; i < 1000000; i++)
        __sync_fetch_and_add(&counter, 1);   // atomic fetch & add
    return NULL;
}

int main(void) {
    pthread_t t[2];
    for (int i = 0; i < 2; i++)
        pthread_create(&t[i], NULL, worker, NULL);
    for (int i = 0; i < 2; i++)
        pthread_join(t[i], NULL);
    printf("counter = %d\n", counter);
    return 0;
}
```

## ticket locks | **bounded waiting**

---

### ticket locks

fetch & add **with** bounded waiting!

---

### ticket locks

```C
struct ticketlock { volatile int next, serving; };

void lock(struct ticketlock *l) {
    int me = __sync_fetch_and_add(&l->next, 1);   // take a ticket
    while (l->serving != me) ;                     // wait for our number
}
void unlock(struct ticketlock *l) {
    l->serving++;                                  // call the next number
}
```

---

### ticket locks

```C [4|5|8]
struct ticketlock { volatile int next, serving; };

void lock(struct ticketlock *l) {
    int me = __sync_fetch_and_add(&l->next, 1);   // take a ticket
    while (l->serving != me) ;                     // wait for our number
}
void unlock(struct ticketlock *l) {
    l->serving++;                                  // call the next number
}
```
