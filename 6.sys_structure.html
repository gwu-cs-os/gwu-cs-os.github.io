## monolithic structure

### microkernel IPC

---

### microkernel IPC

what _actually_ happens when application calls <scb>write()</scb>?

---

### microkernel IPC

- application just calls <scb>write()</scb>
- file system &rarr; **separate process**

---

### microkernel IPC

- application just calls <scb>write()</scb>
- file system &rarr; **separate process**

<img src="./img/sys_structure/ipc_1.png" height="560">

---

### microkernel IPC

**trap** into the microkernel &rarr; <scb>ecall</scb>

<img src="./img/sys_structure/ipc_2.png" height="560">

---

### microkernel IPC

- switch address space <br> <scb>app &rarr; kernel &rarr; FS</scb> 
- "return" into the server (<scb>sret</scb>)

<img src="./img/sys_structure/ipc_3.png" height="560">

---

### microkernel IPC

the server replies &rarr; traps _back_ into the kernel (<scb>ecall</scb>)

<img src="./img/sys_structure/ipc_4.png" height="560">

---

### microkernel IPC

...and switch back into application (<scb>sret</scb>)

<img src="./img/sys_structure/ipc_5.png" height="560">

---

### microkernel IPC | **costs**

one IPC  = $2 \times \texttt{ecall} + 2 \times \texttt{sret} + 2 \times \texttt{process switch}$

---

### microkernel IPC | **costs**

one IPC  = $2 \times \texttt{ecall} + 2 \times \texttt{sret} + 2 \times \text{process switch}$

- <scb>2x</scb> system call
- <scb>2x</scb> process switch
- <scb>2x</scb> kernel code path for IPC

---

### microkernel IPC | **costs**

one IPC  = $2 \times \texttt{ecall} + 2 \times \texttt{sret} + 2 \times \text{process switch}$

- <scb>2x</scb> system call
- <scb>2x</scb> process switch
- <scb>2x</scb> kernel code path for IPC

|||
|----|-----|
| linux <scb>syscall</scb> | $\approx$ <scb>300</scb> cycles |
| microkernel <scb>ipc</scb> <br> (heavily optimized) | $\approx$ <scb>830</scb> cycles |
||

---

### microkernel IPC | **costs**

one IPC  = $2 \times \texttt{ecall} + 2 \times \texttt{sret} + 2 \times \text{process switch}$

- <scb>2x</scb> system call
- <scb>2x</scb> process switch
- <scb>2x</scb> kernel code path for IPC

|||
|----|-----|
| linux <scb>syscall</scb> | $\approx$ <scb>300</scb> cycles |
| microkernel <scb>ipc</scb> <br> (heavily optimized) | $\approx$ <scb>830</scb> cycles |
||

<center><div class="center" data-id="box" style="height: 75px; width: 450px; background: orange;">
<b>IPC is not free!</b>
</div></center>

Note:
- this per-message cost is the classic downside of microkernels.
